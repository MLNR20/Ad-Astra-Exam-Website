<text x="56" y="232" xml:space="preserve" style="white-space:pre" font-family="Consolas, Menlo, monospace" font-size="13"><tspan fill="#569cd6">echo</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#ce9178">&quot;Total items: &quot;</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">$Count</tspan><tspan fill="#d4d4d4">;</tspan></text>
