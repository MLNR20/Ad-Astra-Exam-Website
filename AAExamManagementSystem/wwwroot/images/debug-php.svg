<text x="56" y="144" xml:space="preserve" style="white-space:pre" font-family="Consolas, Menlo, monospace" font-size="13"><tspan fill="#c586c0">foreach</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#9cdcfe">$items</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#569cd6">as</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#9cdcfe">$item</tspan><tspan fill="#d4d4d4">)</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4">{</tspan></text>
